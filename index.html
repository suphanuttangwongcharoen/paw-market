</head>
<body>

    // Dynamic Lucide Icon Renderer
    const LucideIcon = ({ name, size = 18, color = "currentColor", style = {}, fill = "none", className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconNode = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons['HelpCircle']);
          if (iconNode) {
            iconNode.setAttribute('width', size);
            iconNode.setAttribute('height', size);
            iconNode.setAttribute('stroke', color);
            iconNode.setAttribute('fill', fill);
            ref.current.appendChild(iconNode);
          }
        }
      }, [name, size, color, fill]);

      return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', ...style }} className={className} />;
    };

    function NavBar({ view, setView, cartCount, onOpenCart }) {
      const items = [
        { id: "shop", label: "ร้านค้า", icon: "ShoppingCart" },

                const active = view === it.id;
                return (

      const catInfo = CATS.find((c) => c.id === product.cat) || CATS[0];

        <div style={{
          position: "fixed", inset: 0, zIndex: 100, background: "rgba(46,38,33,0.6)",

        }}>

            background: "#fff", borderRadius: 24, maxWidth: 700, width: "100%", maxHeight: "90vh",

    function CartModal({ isOpen, onClose, cart, setCart }) {
      const [shippingMethod, setShippingMethod] = useState("normal");
      const [paymentMethod, setPaymentMethod] = useState("promptpay");
      const [address, setAddress] = useState({ name: "", phone: "", detail: "", code: "" });
      const [discountCode, setDiscountCode] = useState("");
      const [discountApplied, setDiscountApplied] = useState(false);
      const [isOrdered, setIsOrdered] = useState(false);

      if (!isOpen) return null;

      const cartMap = cart.reduce((acc, item) => {
        if (!acc[item.id]) acc[item.id] = { ...item, qty: 0 };
        acc[item.id].qty += 1;
        return acc;
      }, {});
      const cartItems = Object.values(cartMap);

      const subtotal = cartItems.reduce((sum, item) => sum + item.price * item.qty, 0);
      const shippingFee = subtotal === 0 ? 0 : shippingMethod === "express" ? 150 : 50;
      const discountAmount = discountApplied ? Math.round(subtotal * 0.1) : 0;
      const grandTotal = Math.max(0, subtotal + shippingFee - discountAmount);

      const updateQty = (id, delta) => {
        if (delta > 0) {
          const item = cart.find(i => i.id === id);
          setCart([...cart, item]);
        } else {
          const idx = cart.findIndex(i => i.id === id);
          if (idx !== -1) {
            const nextCart = [...cart];
            nextCart.splice(idx, 1);
            setCart(nextCart);
          }
        }
      };

      const handleApplyDiscount = () => {
        if (discountCode.trim().toUpperCase() === "PAW10") {
          setDiscountApplied(true);
        } else {
          alert("โค้ดไม่ถูกต้อง (ลองใช้โค้ด PAW10)");
        }
      };

      const handleCheckout = (e) => {
        e.preventDefault();
        if (cartItems.length === 0) return alert("ตะกร้าสินค้ายังว่างอยู่ครับ");
        if (!address.name || !address.phone || !address.detail) {
          return alert("กรุณากรอกข้อมูลจัดส่งให้ครบถ้วน");
        }
        setIsOrdered(true);
        setTimeout(() => {
          setCart([]);
          setIsOrdered(false);
          onClose();
          alert("🎉 สั่งซื้อสำเร็จ! ร้านค้ากำลังเตรียมจัดส่งให้คุณอย่างปลอดภัยที่สุด");
        }, 1500);
      };

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 100, background: "rgba(46,38,33,0.6)",
          backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16
        }}>
          <div style={{
            background: "#fff", borderRadius: 24, maxWidth: 880, width: "100%", maxHeight: "90vh",
            overflow: "hidden", border: `1px solid ${TOKENS.line}`, boxShadow: "0 20px 40px rgba(0,0,0,0.2)",
            display: "flex", flexDirection: "column"
          }}>
            <div style={{ padding: "16px 24px", borderBottom: `1px solid ${TOKENS.line}`, display: "flex", justifyContent: "space-between", alignItems: "center", background: TOKENS.bg }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <LucideIcon name="ShoppingCart" size={20} color={TOKENS.ink} />
                <span style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 18, color: TOKENS.ink }}>ตะกร้าสินค้า & ชำระเงิน</span>
              </div>
              <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}>
                <LucideIcon name="X" size={20} color={TOKENS.inkSoft} />
              </button>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", overflowY: "auto", flex: 1 }}>
              <div style={{ padding: 20, borderRight: `1px solid ${TOKENS.line}` }}>
                <h3 style={{ fontFamily: "Prompt", fontSize: 14, fontWeight: 700, marginBottom: 12 }}>1. รายการสั่งซื้อ ({cart.length} ชิ้น)</h3>
                {cartItems.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "30px 0", color: TOKENS.inkSoft, fontFamily: "Sarabun" }}>
                    ไม่มีสินค้าในตะกร้า 🐾
                  </div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
                    {cartItems.map((item) => (
                      <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: 8, background: TOKENS.bg, borderRadius: 12 }}>
                        <img src={item.img} alt={item.name} style={{ width: 50, height: 50, borderRadius: 8, objectFit: "cover" }} />
                        <div style={{ flex: 1 }}>
                          <div style={{ fontFamily: "Prompt", fontSize: 13, fontWeight: 600, color: TOKENS.ink }}>{item.name}</div>
                          <div style={{ fontFamily: "Prompt", fontSize: 12, color: TOKENS.inkSoft }}>฿{item.price.toLocaleString()}</div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 6, background: "#fff", borderRadius: 999, border: `1px solid ${TOKENS.line}`, padding: "2px 8px" }}>
                          <button onClick={() => updateQty(item.id, -1)} style={{ border: "none", background: "none", cursor: "pointer", fontWeight: "bold" }}>-</button>
                          <span style={{ fontFamily: "Prompt", fontSize: 12, fontWeight: 600 }}>{item.qty}</span>
                          <button onClick={() => updateQty(item.id, 1)} style={{ border: "none", background: "none", cursor: "pointer", fontWeight: "bold" }}>+</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <h3 style={{ fontFamily: "Prompt", fontSize: 14, fontWeight: 700, marginBottom: 12 }}>2. ข้อมูลการจัดส่ง</h3>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, fontFamily: "Sarabun", fontSize: 13 }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <input placeholder="ชื่อ-นามสกุล ผู้รับ" value={address.name} onChange={(e) => setAddress({ ...address, name: e.target.value })} style={{ padding: "8px 12px", borderRadius: 8, border: `1px solid ${TOKENS.line}` }} />
                    <input placeholder="เบอร์โทรศัพท์" value={address.phone} onChange={(e) => setAddress({ ...address, phone: e.target.value })} style={{ padding: "8px 12px", borderRadius: 8, border: `1px solid ${TOKENS.line}` }} />
                  </div>
                  <textarea placeholder="ที่อยู่โดยละเอียด (บ้านเลขที่, ถนน, แขวง/ตำบล)" value={address.detail} onChange={(e) => setAddress({ ...address, detail: e.target.value })} style={{ padding: "8px 12px", borderRadius: 8, border: `1px solid ${TOKENS.line}`, height: 60, resize: "none" }} />
                </div>

                <h3 style={{ fontFamily: "Prompt", fontSize: 14, fontWeight: 700, margin: "16px 0 12px" }}>3. รูปแบบการจัดส่ง</h3>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <button onClick={() => setShippingMethod("normal")} style={{
                    padding: 10, borderRadius: 12, border: `1.5px solid ${shippingMethod === "normal" ? TOKENS.ink : TOKENS.line}`,
                    background: shippingMethod === "normal" ? TOKENS.bg : "#fff", textAlign: "left", cursor: "pointer"
                  }}>
                    <div style={{ fontFamily: "Prompt", fontSize: 12, fontWeight: 600 }}>ขนส่งธรรมดา (฿50)</div>
                    <div style={{ fontFamily: "Sarabun", fontSize: 11, color: TOKENS.inkSoft }}>2-3 วันสำหรับสัตว์เลี้ยง</div>
                  </button>
                  <button onClick={() => setShippingMethod("express")} style={{
                    padding: 10, borderRadius: 12, border: `1.5px solid ${shippingMethod === "express" ? TOKENS.ink : TOKENS.line}`,
                    background: shippingMethod === "express" ? TOKENS.bg : "#fff", textAlign: "left", cursor: "pointer"
                  }}>
                    <div style={{ fontFamily: "Prompt", fontSize: 12, fontWeight: 600 }}>ส่งด่วนพิเศษ (฿150)</div>
                    <div style={{ fontFamily: "Sarabun", fontSize: 11, color: TOKENS.inkSoft }}>รถปรับอุณหภูมิ ได้ใน 24 ชม.</div>
                  </button>
                </div>
              </div>

              <div style={{ padding: 20, background: TOKENS.bg, display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
                <div>
                  <h3 style={{ fontFamily: "Prompt", fontSize: 14, fontWeight: 700, marginBottom: 12 }}>4. วิธีการชำระเงิน</h3>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
                    {[
                      { id: "promptpay", label: "PromptPay QR", icon: "Tag" },
                      { id: "credit", label: "บัตรเครดิต/เดบิต", icon: "CreditCard" },
                      { id: "bank", label: "โอนผ่านธนาคาร", icon: "Lock" },
                      { id: "cod", label: "เก็บเงินปลายทาง", icon: "Truck" },
                    ].map((p) => (
                      <button key={p.id} onClick={() => setPaymentMethod(p.id)} style={{
                        padding: "8px 10px", borderRadius: 10, border: `1.5px solid ${paymentMethod === p.id ? TOKENS.ink : TOKENS.line}`,
                        background: paymentMethod === p.id ? "#fff" : "transparent", cursor: "pointer",
                        display: "flex", alignItems: "center", gap: 6, fontFamily: "Prompt", fontSize: 12, fontWeight: 500
                      }}>
                        <LucideIcon name={p.icon} size={14} /> {p.label}
                      </button>
                    ))}
                  </div>

                  <div style={{ borderTop: `1px solid ${TOKENS.line}`, paddingTop: 12, marginBottom: 12 }}>
                    <div style={{ fontFamily: "Prompt", fontSize: 12, fontWeight: 600, marginBottom: 6 }}>โค้ดส่วนลด</div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <input placeholder="กรอกโค้ด (ลองใช้ PAW10)" value={discountCode} onChange={(e) => setDiscountCode(e.target.value)} style={{ flex: 1, padding: "6px 10px", borderRadius: 8, border: `1px solid ${TOKENS.line}`, fontFamily: "Sarabun", fontSize: 12 }} />
                      <button onClick={handleApplyDiscount} style={{ background: TOKENS.ink, color: "#fff", border: "none", borderRadius: 8, padding: "0 12px", fontFamily: "Prompt", fontSize: 12, cursor: "pointer" }}>ใช้</button>
                    </div>
                    {discountApplied && <div style={{ fontFamily: "Sarabun", fontSize: 11, color: TOKENS.rabbit, marginTop: 4 }}>✓ ใช้ส่วนลด 10% เรียบร้อยแล้ว</div>}
                  </div>

                  <div style={{ background: "#fff", padding: 12, borderRadius: 12, border: `1px solid ${TOKENS.line}`, display: "flex", flexDirection: "column", gap: 6, fontFamily: "Sarabun", fontSize: 12.5 }}>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>ยอดรวมสินค้า</span><span>฿{subtotal.toLocaleString()}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>ค่าจัดส่ง</span><span>฿{shippingFee}</span></div>
                    {discountApplied && <div style={{ display: "flex", justifyContent: "space-between", color: TOKENS.cat }}><span>ส่วนลด (10%)</span><span>-฿{discountAmount.toLocaleString()}</span></div>}
                    <div style={{ borderTop: `1px solid ${TOKENS.line}`, paddingTop: 6, display: "flex", justifyContent: "space-between", fontFamily: "Prompt", fontWeight: 700, fontSize: 15, color: TOKENS.ink }}>
                      <span>ราคาสุทธิ</span>
                      <span>฿{grandTotal.toLocaleString()}</span>
                    </div>
                  </div>
                </div>

                <button onClick={handleCheckout} disabled={isOrdered} style={{
                  width: "100%", border: "none", borderRadius: 999, padding: "12px", background: TOKENS.pink, color: "#fff",
                  fontFamily: "Prompt", fontSize: 14, fontWeight: 700, cursor: isOrdered ? "default" : "pointer", marginTop: 16,
                  boxShadow: "0 4px 12px rgba(240,174,180,0.4)"
                }}>
                  {isOrdered ? "กำลังดำเนินการ..." : `ชำระเงิน ฿${grandTotal.toLocaleString()}`}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

      const [messages, setMessages] = useState([
        { 
          role: "assistant", 
          text: "สวัสดีค่ะ! 🐾 หนูคือผู้ช่วย AI อัจฉริยะแห่ง Paw Market ที่พร้อมแนะนำสัตว์เลี้ยง คำนวณงบประมาณ และจัดเตรียมตู้/กรงเลี้ยงอย่างมืออาชีพ\n\nอยากให้ช่วยเรื่องไหนก่อนดีคะ? สามารถเลือกหัวข้อด่วนด้านล่างได้เลยค่ะ!" 
        },
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, loading]);

      const quickPrompts = [
        "อยู่คอนโด เลี้ยงสัตว์อะไรได้บ้าง งบไม่เกิน 3,000",
        "มือใหม่ อยากเลี้ยงปลาสวยงาม ต้องเตรียมอะไรบ้าง",
        "เปรียบเทียบข้อดีแมวสก็อตติช vs แมวไทย",
        "แนะนำสัตว์เลี้ยงดูแลน้อย ไม่ต้องออกกำลังกาย",
      ];

      const send = async (textOverride) => {
        const text = (textOverride ?? input).trim();
        if (!text || loading) return;

        const newMessages = [...messages, { role: "user", text }];
        setMessages(newMessages);
        setInput("");
        setLoading(true);

        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 1000,
              system: "คุณคือผู้ช่วย AI อัจฉริยะประจำร้าน 'อุ้งเท้า (Paw Market)' มีความรอบรู้ระดับผู้เชี่ยวชาญด้านสัตว์เลี้ยงทุกชนิด หน้าที่ของคุณคือแนะนำสัตว์เลี้ยง คำนวณงบประมาณ และให้คำแนะนำเรื่องอุปกรณ์จัดเลี้ยงที่จำเป็น ให้คำตอบชัดเจน สดใส อบอุ่น ภาษาไทย",
              messages: newMessages.map((m) => ({ role: m.role, content: m.text })),
            }),
          });
          const data = await response.json();
          const textBlocks = (data.content || []).filter((c) => c.type === "text").map((c) => c.text);
          const reply = textBlocks.join("\n").trim() || "ขออภัยค่ะ ระบบขัดข้องชั่วคราว ลองใหม่อีกครั้งนะคะ";
          setMessages((prev) => [...prev, { role: "assistant", text: reply }]);
        } catch (e) {
          setMessages((prev) => [...prev, { role: "assistant", text: "ขออภัยค่ะ สัญญาณการเชื่อมต่อขัดข้องชั่วคราว ลองพิมพ์คำถามใหม่อีกครั้งนะคะ 🐾" }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{ maxWidth: 740, margin: "0 auto", padding: "24px 20px 50px" }}>
          <div style={{ textAlign: "center", marginBottom: 18 }}>
            <div style={{
              width: 50, height: 50, borderRadius: 16, background: TOKENS.pink, margin: "0 auto 10px",
              display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 4px 12px rgba(240,174,180,0.4)"
            }}>
              <LucideIcon name="Sparkles" size={24} color="#fff" />
            </div>
            <h2 style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 22, color: TOKENS.ink, margin: "0 0 4px" }}>ผู้ช่วย AI อัจฉริยะประจำร้าน</h2>
            <p style={{ fontFamily: "Sarabun", fontSize: 13, color: TOKENS.inkSoft, margin: 0 }}>ปรึกษาเรื่องสายพันธุ์ งบประมาณ วิธีการเลี้ยงดู ได้ตลอด 24 ชม.</p>
          </div>

          <div style={{
            background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 24,
            display: "flex", flexDirection: "column", height: 500, overflow: "hidden", boxShadow: "0 4px 20px rgba(0,0,0,0.03)"
          }}>
            <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "18px", display: "flex", flexDirection: "column", gap: 12 }}>
              {messages.map((m, i) => (
                <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
                  {m.role === "assistant" && (
                    <div style={{ width: 28, height: 28, borderRadius: 10, background: TOKENS.pink, flexShrink: 0, marginRight: 8, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <LucideIcon name="PawPrint" size={14} color="#fff" />
                    </div>
                  )}
                  <div style={{
                    maxWidth: "80%", padding: "10px 14px", borderRadius: m.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                    background: m.role === "user" ? TOKENS.ink : TOKENS.bg, color: m.role === "user" ? "#fff" : TOKENS.ink,
                    fontFamily: "Sarabun", fontSize: 13.5, lineHeight: 1.6, whiteSpace: "pre-wrap",
                  }}>
                    {m.text}
                  </div>
                </div>
              ))}
              {loading && (
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ width: 28, height: 28, borderRadius: 10, background: TOKENS.pink, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <LucideIcon name="PawPrint" size={14} color="#fff" />
                  </div>
                  <div style={{ fontFamily: "Sarabun", fontSize: 13, color: TOKENS.inkSoft, padding: "8px 12px", background: TOKENS.bg, borderRadius: 12 }}>
                    กำลังประมวลผลคำตอบ...
                  </div>
                </div>
              )}
            </div>

            <div style={{ padding: "0 14px 10px", display: "flex", gap: 6, flexWrap: "wrap" }}>
              {quickPrompts.map((q) => (
                <button key={q} onClick={() => send(q)} style={{
                  border: `1px solid ${TOKENS.line}`, background: "#fff", borderRadius: 999, padding: "5px 11px",
                  fontFamily: "Sarabun", fontSize: 11.5, color: TOKENS.inkSoft, cursor: "pointer",
                }}>{q}</button>
              ))}
            </div>

            <div style={{ display: "flex", gap: 8, padding: 12, borderTop: `1px solid ${TOKENS.line}` }}>
              <input
                value={input} onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") send(); }}
                placeholder="สอบถามเกี่ยวกับการเลี้ยงสัตว์..."
                style={{
                  flex: 1, border: `1px solid ${TOKENS.line}`, borderRadius: 999, padding: "9px 16px",
                  fontFamily: "Sarabun", fontSize: 13.5, outline: "none",
                }}
              />
              <button onClick={() => send()} disabled={loading} style={{
                border: "none", borderRadius: 999, width: 38, height: 38, flexShrink: 0,
                background: TOKENS.ink, color: "#fff", cursor: loading ? "default" : "pointer",
                display: "flex", alignItems: "center", justifyContent: "center", opacity: loading ? 0.5 : 1,
              }}>
                <LucideIcon name="Send" size={15} />
              </button>
            </div>
          </div>
        </div>
      );
    }

    function DashboardView() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [password, setPassword] = useState("");
      const [insight, setInsight] = useState(null);

      const handleLogin = (e) => {
        e.preventDefault();
        if (password === "1234" || password === "admin") {
          setIsAuthenticated(true);
        } else {
          alert("รหัสผ่านไม่ถูกต้อง (ทดลองใช้รหัส: 1234)");
        }
      };

      useEffect(() => {
        if (!isAuthenticated) return;
        setInsight({
          summary: "ยอดขายเดือนกรกฎาคมเติบโตสูงสุดในรอบปี สินค้าหมวดปลาและแมวยังครองตลาดหลัก",
          insights: [
            "หมวดแมวทำรายได้สูงสุดตามมูลค่าเฉลี่ยต่อหน่วย",
            "ยอดขายกุ้งเชอร์รี่ทำสถิติยอดสั่งซื้อถี่ที่สุด",
          ],
          actions: [
            "ควรจัดโปรโมชันแพ็กเกจคู่ สำหรับตู้เลี้ยงปลาและอุปกรณ์",
            "เพิ่มสต๊อกอาหารแมวเกรดพรีเมียมรองรับลูกค้าใหม่",
          ],
        });
      }, [isAuthenticated]);

      if (!isAuthenticated) {
        return (
          <div style={{ maxWidth: 400, margin: "60px auto", padding: "30px 20px", textAlign: "center" }}>
            <div style={{ background: "#fff", padding: 28, borderRadius: 24, border: `1px solid ${TOKENS.line}`, boxShadow: "0 4px 20px rgba(0,0,0,0.04)" }}>
              <div style={{ width: 48, height: 48, borderRadius: 16, background: TOKENS.bg, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px" }}>
                <LucideIcon name="Lock" size={22} color={TOKENS.ink} />
              </div>
              <h2 style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 20, color: TOKENS.ink, margin: "0 0 6px" }}>เข้าสู่ระบบผู้ขาย</h2>
              <p style={{ fontFamily: "Sarabun", fontSize: 13, color: TOKENS.inkSoft, marginBottom: 20 }}>กรอกรหัสผ่านเพื่อเข้าถึงแดชบอร์ดร้านค้า</p>
              
              <form onSubmit={handleLogin} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <input
                  type="password"
                  placeholder="รหัสผ่าน (ทดลองใช้: 1234)"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  style={{ padding: "10px 14px", borderRadius: 10, border: `1px solid ${TOKENS.line}`, fontFamily: "Sarabun", fontSize: 14 }}
                />
                <button type="submit" style={{
                  border: "none", borderRadius: 10, padding: "10px", background: TOKENS.ink, color: "#fff",
                  fontFamily: "Prompt", fontSize: 14, fontWeight: 600, cursor: "pointer"
                }}>
                  ยืนยันรหัสผ่าน
                </button>
              </form>
              <div style={{ fontFamily: "Sarabun", fontSize: 11.5, color: TOKENS.inkSoft, marginTop: 14 }}>
                💡 หรือกดคลิก <span onClick={() => setIsAuthenticated(true)} style={{ color: TOKENS.cat, textDecoration: "underline", cursor: "pointer" }}>เข้าสู่ระบบด้วยบัญชีสาธิต</span>
              </div>
            </div>
          </div>
        );
      }

      const stats = [
        { label: "ยอดขายรวมเดือนนี้", value: "฿84,500", change: "+18.2%", up: true, icon: "DollarSign", color: TOKENS.cat },
        { label: "คำสั่งซื้อสำเร็จ", value: "389", change: "+12.1%", up: true, icon: "Package", color: TOKENS.fish },
        { label: "จำนวนลูกค้าใหม่", value: "112", change: "+6.4%", up: true, icon: "Users", color: TOKENS.rabbit },
        { label: "อัตราคืนสินค้า", value: "0.8%", change: "-0.4%", up: false, icon: "TrendingUp", color: TOKENS.dog },
      ];

      return (
        <div style={{ maxWidth: 1140, margin: "0 auto", padding: "24px 20px 60px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <div>
              <h2 style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 22, color: TOKENS.ink, margin: "0 0 2px" }}>แดชบอร์ดบริหารจัดการร้านค้า</h2>
              <p style={{ fontFamily: "Sarabun", fontSize: 13, color: TOKENS.inkSoft, margin: 0 }}>วิเคราะห์สถิติมุมมองผู้ขายย้อนหลังประจำเดือน</p>
            </div>
            <button onClick={() => setIsAuthenticated(false)} style={{ background: "none", border: `1px solid ${TOKENS.line}`, padding: "6px 12px", borderRadius: 999, fontFamily: "Prompt", fontSize: 12, cursor: "pointer" }}>
              ออกจากระบบ
            </button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14, marginBottom: 18 }}>
            {stats.map((s) => (
              <div key={s.label} style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 18, padding: 16 }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                  <div style={{ width: 32, height: 32, borderRadius: 10, background: s.color + "22", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <LucideIcon name={s.icon} size={16} color={s.color} />
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 2, fontFamily: "Prompt", fontSize: 11, fontWeight: 600, color: s.up ? TOKENS.rabbit : TOKENS.cat }}>
                    <LucideIcon name={s.up ? "ArrowUpRight" : "ArrowDownRight"} size={12} /> {s.change}
                  </div>
                </div>
                <div style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 20, color: TOKENS.ink }}>{s.value}</div>
                <div style={{ fontFamily: "Sarabun", fontSize: 11.5, color: TOKENS.inkSoft, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>

          <div style={{ background: "linear-gradient(135deg, #FFF9F2 0%, #FDF1F0 100%)", border: `1px solid ${TOKENS.line}`, borderRadius: 20, padding: 20, marginBottom: 18 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
              <div style={{ width: 28, height: 28, borderRadius: 8, background: TOKENS.pink, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <LucideIcon name="Sparkles" size={14} color="#fff" />
              </div>
              <div style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 14, color: TOKENS.ink }}>การวิเคราะห์การขายอัตโนมัติจาก AI</div>
            </div>

            {insight && (
              <div>
                <p style={{ fontFamily: "Sarabun", fontSize: 14, color: TOKENS.ink, lineHeight: 1.6, margin: "0 0 12px" }}>{insight.summary}</p>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                  <div style={{ background: "#fff", padding: 12, borderRadius: 12, border: `1px solid ${TOKENS.line}` }}>
                    <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 12, color: TOKENS.inkSoft, marginBottom: 6 }}>📌 ข้อสังเกตสำคัญ</div>
                    {insight.insights.map((t, i) => (
                      <div key={i} style={{ fontFamily: "Sarabun", fontSize: 12.5, color: TOKENS.ink, marginBottom: 4 }}>• {t}</div>
                    ))}
                  </div>
                  <div style={{ background: "#fff", padding: 12, borderRadius: 12, border: `1px solid ${TOKENS.line}` }}>
                    <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 12, color: TOKENS.inkSoft, marginBottom: 6 }}>💡 คำแนะนำการปรับกลยุทธ์</div>
                    {insight.actions.map((t, i) => (
                      <div key={i} style={{ fontFamily: "Sarabun", fontSize: 12.5, color: TOKENS.ink, marginBottom: 4 }}>• {t}</div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>

          {ResponsiveContainer && (
            <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 16, marginBottom: 16 }}>
              <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 20, padding: 18 }}>
                <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 13.5, color: TOKENS.ink, marginBottom: 12 }}>แนวโน้มยอดขายรายเดือน (บาท)</div>
                <ResponsiveContainer width="100%" height={200}>
                  <LineChart data={SALES_TREND}>
                    <CartesianGrid stroke={TOKENS.line} vertical={false} />
                    <XAxis dataKey="m" tick={{ fontFamily: "Sarabun", fontSize: 11 }} />
                    <YAxis tick={{ fontFamily: "Sarabun", fontSize: 10 }} width={40} />
                    <Tooltip contentStyle={{ fontFamily: "Sarabun", fontSize: 12, borderRadius: 8 }} />
                    <Line type="monotone" dataKey="ยอดขาย" stroke={TOKENS.cat} strokeWidth={3} dot={{ r: 4 }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>

              <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 20, padding: 18 }}>
                <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 13.5, color: TOKENS.ink, marginBottom: 12 }}>สัดส่วนยอดขายตามหมวดหมู่ (%)</div>
                <ResponsiveContainer width="100%" height={200}>
                  <PieChart>
                    <Pie data={CAT_SHARE} dataKey="value" nameKey="name" innerRadius={40} outerRadius={70} paddingAngle={2}>
                      {CAT_SHARE.map((c, i) => <Cell key={i} fill={c.color} />)}
                    </Pie>
                    <Tooltip contentStyle={{ fontFamily: "Sarabun", fontSize: 12, borderRadius: 8 }} />
                    <Legend wrapperStyle={{ fontFamily: "Sarabun", fontSize: 11 }} />
                  </PieChart>
                </ResponsiveContainer>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PawMarket() {
      const [view, setView] = useState("shop");
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);

      const addToCart = (p) => setCart((c) => [...c, p]);

      return (
        <div style={{ fontFamily: "Sarabun, sans-serif", background: TOKENS.bg, minHeight: "100vh", color: TOKENS.ink }}>
          <NavBar 
            view={view} 
            setView={setView} 
            cartCount={cart.length} 
            onOpenCart={() => setIsCartOpen(true)} 
          />

          {view === "shop" && <ShopView addToCart={addToCart} onViewProduct={(p) => setSelectedProduct(p)} />}
          {view === "chat" && <ChatView />}
          {view === "dashboard" && <DashboardView />}

          <CartModal 
            isOpen={isCartOpen} 
            onClose={() => setIsCartOpen(false)} 
            cart={cart} 
            setCart={setCart} 
          />

          <ProductModal 
            product={selectedProduct} 
            onClose={() => setSelectedProduct(null)} 
            onAddToCart={addToCart} 
          />

          <div style={{ borderTop: `1px solid ${TOKENS.line}`, padding: "24px 20px", textAlign: "center" }}>
            <PawDivider />
            <div style={{ fontFamily: "Sarabun", fontSize: 12, color: TOKENS.inkSoft, marginTop: 6 }}>
              © 2026 อุ้งเท้า (Paw Market Place) — ตลาดสัตว์เลี้ยงออนไลน์อันดับ 1
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PawMarket />);
  </script>
</body>
</html>
