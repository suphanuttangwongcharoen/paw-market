                    <div style={{ fontFamily: "Sarabun", fontSize: 12.5, color: TOKENS.inkSoft, lineHeight: 1.5, flex: 1 }}>{p.desc}</div>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 4 }}>
                      <div style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 17, color: TOKENS.ink }}>{money(p.price)}</div>
                      <button onClick={() => handleAdd(p, 1)} style={{
                        border: "none", cursor: "pointer", borderRadius: 999, padding: "8px 14px",
                        background: justAdded === p.id ? TOKENS.green : catInfo.color, color: "#fff",
                        fontFamily: "Prompt", fontSize: 12.5, fontWeight: 500, display: "flex", alignItems: "center", gap: 5, transition: "background .2s",
                      }}>
                        {justAdded === p.id ? "เพิ่มแล้ว ✓" : <>ใส่ตะกร้า <ShoppingCart size={12} /></>}
                      </button>
                    </div>
                    <button onClick={() => setOpenProduct(p)} style={{
                      border: `1px solid ${TOKENS.line}`, background: "none", cursor: "pointer", borderRadius: 999, padding: "7px 10px",
                      fontFamily: "Sarabun", fontSize: 12, color: TOKENS.inkSoft, display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
                    }}>ดูรายละเอียด <ChevronRight size={13} /></button>
                  </div>
                </div>
              );
            })}
            {filtered.length === 0 && (
              <div style={{ gridColumn: "1/-1", textAlign: "center", padding: "40px 0", fontFamily: "Sarabun", color: TOKENS.inkSoft }}>
                ไม่พบสัตว์เลี้ยงที่ค้นหา ลองคำอื่นดูนะ 🐾
              </div>
            )}
          </div>

          {openProduct && (
            <ProductDetail product={openProduct} catInfo={CATS.find((c) => c.id === openProduct.cat)} onClose={() => setOpenProduct(null)} onAdd={handleAdd} />
          )}
        </div>
      );
    }

    function CatPill({ label, active, onClick, icon: Icon, color, soft }) {
      return (
        <button onClick={onClick} style={{
          display: "flex", alignItems: "center", gap: 7, border: `1.5px solid ${active ? color : TOKENS.line}`,
          background: active ? soft : "#fff", color: active ? color : TOKENS.inkSoft, cursor: "pointer",
          padding: "9px 16px", borderRadius: 999, fontFamily: "Prompt", fontSize: 13, fontWeight: 500, transition: "all .15s",
        }}>
          <Icon size={14} /> {label}
        </button>
      );
    }

    /* --------------------------- ตะกร้าสินค้า + เช็คเอาต์ --------------------------- */
    function CartView({ cart, updateQty, removeItem, setView }) {
      const [promo, setPromo] = useState("");
      const [appliedPromo, setAppliedPromo] = useState(null);
      const [promoMsg, setPromoMsg] = useState("");
      const [shipMethod, setShipMethod] = useState("standard");
      const [payMethod, setPayMethod] = useState("promptpay");
      const [address, setAddress] = useState({ name: "", phone: "", line: "", district: "", province: "", zip: "" });
      const [placed, setPlaced] = useState(false);
      const [orderNo, setOrderNo] = useState("");

      const subtotal = cart.reduce((s, it) => s + it.product.price * it.qty, 0);
      let discount = 0;
      if (appliedPromo) {
        discount = appliedPromo.type === "percent" ? Math.round(subtotal * appliedPromo.value / 100) : appliedPromo.value;
        discount = Math.min(discount, subtotal);
      }
      const shippingCost = cart.length ? SHIPPING[shipMethod].price : 0;
      const total = subtotal - discount + shippingCost;

      const applyPromo = () => {
        const code = promo.trim().toUpperCase();
        if (PROMO_CODES[code]) { setAppliedPromo(PROMO_CODES[code]); setPromoMsg(`ใช้โค้ดสำเร็จ — ${PROMO_CODES[code].label}`); }
        else { setAppliedPromo(null); setPromoMsg("ไม่พบโค้ดนี้ ลองตรวจสอบอีกครั้ง"); }
      };

      const addressComplete = address.name && address.phone && address.line && address.district && address.province && address.zip;

      const placeOrder = () => {
        setOrderNo("PW" + Math.floor(100000 + Math.random() * 900000));
        setPlaced(true);
      };

      if (cart.length === 0 && !placed) {
        return (
          <div style={{ maxWidth: 560, margin: "0 auto", padding: "80px 20px", textAlign: "center" }}>
            <div style={{ width: 64, height: 64, borderRadius: 20, background: TOKENS.catSoft, margin: "0 auto 16px", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <ShoppingCart size={28} color={TOKENS.cat} />
            </div>
            <h2 style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 20, color: TOKENS.ink, margin: "0 0 8px" }}>ตะกร้าของคุณยังว่างอยู่</h2>
            <p style={{ fontFamily: "Sarabun", fontSize: 14, color: TOKENS.inkSoft, margin: "0 0 20px" }}>เลือกสัตว์เลี้ยงที่ถูกใจแล้วกดใส่ตะกร้าได้เลย</p>
            <button onClick={() => setView("shop")} style={{ border: "none", background: TOKENS.ink, color: "#fff", fontFamily: "Prompt", fontSize: 13.5, fontWeight: 500, padding: "11px 22px", borderRadius: 999, cursor: "pointer" }}>ไปที่ร้านค้า</button>
          </div>
        );
      }

      if (placed) {
        return (
          <div style={{ maxWidth: 560, margin: "0 auto", padding: "80px 20px", textAlign: "center" }}>
            <div style={{ width: 72, height: 72, borderRadius: 22, background: "#E5EFE3", margin: "0 auto 18px", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <CheckCircle2 size={34} color={TOKENS.green} />
            </div>
            <h2 style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 22, color: TOKENS.ink, margin: "0 0 8px" }}>สั่งซื้อสำเร็จแล้ว! 🎉</h2>
            <p style={{ fontFamily: "Sarabun", fontSize: 14, color: TOKENS.inkSoft, margin: "0 0 4px" }}>หมายเลขคำสั่งซื้อของคุณคือ</p>
            <div style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 20, color: TOKENS.cat, marginBottom: 20 }}>{orderNo}</div>
            <p style={{ fontFamily: "Sarabun", fontSize: 13.5, color: TOKENS.inkSoft, margin: "0 0 24px" }}>
              จัดส่งแบบ{SHIPPING[shipMethod].label} ไปยัง {address.name} — ชำระเงินโดย {PAYMENTS.find(p => p.id === payMethod).label}
            </p>
            <button onClick={() => setView("shop")} style={{ border: "none", background: TOKENS.ink, color: "#fff", fontFamily: "Prompt", fontSize: 13.5, fontWeight: 500, padding: "11px 22px", borderRadius: 999, cursor: "pointer" }}>เลือกซื้อสัตว์เลี้ยงเพิ่ม</button>
          </div>
        );
      }

      return (
        <div style={{ maxWidth: 1000, margin: "0 auto", padding: "28px 20px 70px" }}>
          <h2 style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 24, color: TOKENS.ink, margin: "0 0 20px" }}>ตะกร้าสินค้า</h2>

          <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 22, alignItems: "start" }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {/* รายการสินค้า */}
              <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 18, padding: 18 }}>
                <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 14, color: TOKENS.ink, marginBottom: 12 }}>รายการสินค้า ({cart.length})</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {cart.map((it) => {
                    const catInfo = CATS.find((c) => c.id === it.product.cat);
                    return (
                      <div key={it.product.id} style={{ display: "flex", gap: 12, alignItems: "center", borderBottom: `1px solid ${TOKENS.line}`, paddingBottom: 12 }}>
                        <img src={it.product.img} alt={it.product.name} style={{ width: 56, height: 56, borderRadius: 12, objectFit: "cover", background: catInfo.soft, flexShrink: 0 }} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontFamily: "Prompt", fontWeight: 500, fontSize: 13.5, color: TOKENS.ink, marginBottom: 2 }}>{it.product.name}</div>
                          <div style={{ fontFamily: "Sarabun", fontSize: 12.5, color: TOKENS.inkSoft }}>{money(it.product.price)} / ชิ้น</div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", border: `1px solid ${TOKENS.line}`, borderRadius: 999 }}>
                          <button onClick={() => updateQty(it.product.id, it.qty - 1)} style={{ border: "none", background: "none", padding: "5px 9px", cursor: "pointer" }}><Minus size={12} /></button>
                          <span style={{ fontFamily: "Prompt", fontSize: 12.5, minWidth: 18, textAlign: "center" }}>{it.qty}</span>
                          <button onClick={() => updateQty(it.product.id, it.qty + 1)} style={{ border: "none", background: "none", padding: "5px 9px", cursor: "pointer" }}><Plus size={12} /></button>
                        </div>
                        <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 13.5, color: TOKENS.ink, minWidth: 70, textAlign: "right" }}>{money(it.product.price * it.qty)}</div>
                        <button onClick={() => removeItem(it.product.id)} style={{ border: "none", background: "none", cursor: "pointer", color: TOKENS.inkSoft, padding: 4 }}><Trash2 size={15} /></button>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* ที่อยู่จัดส่ง */}
              <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 18, padding: 18 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "Prompt", fontWeight: 600, fontSize: 14, color: TOKENS.ink, marginBottom: 12 }}>
                  <MapPin size={15} color={TOKENS.cat} /> ที่อยู่จัดส่ง
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <Field label="ชื่อ-นามสกุล" value={address.name} onChange={(v) => setAddress({ ...address, name: v })} />
                  <Field label="เบอร์โทรศัพท์" value={address.phone} onChange={(v) => setAddress({ ...address, phone: v })} />
                  <div style={{ gridColumn: "1/-1" }}><Field label="ที่อยู่ (บ้านเลขที่ ถนน ซอย)" value={address.line} onChange={(v) => setAddress({ ...address, line: v })} /></div>
                  <Field label="เขต/อำเภอ" value={address.district} onChange={(v) => setAddress({ ...address, district: v })} />
                  <Field label="จังหวัด" value={address.province} onChange={(v) => setAddress({ ...address, province: v })} />
                  <Field label="รหัสไปรษณีย์" value={address.zip} onChange={(v) => setAddress({ ...address, zip: v })} />
                </div>
              </div>

              {/* วิธีจัดส่ง */}
              <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 18, padding: 18 }}>
                <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 14, color: TOKENS.ink, marginBottom: 12 }}>วิธีจัดส่ง</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {Object.entries(SHIPPING).map(([key, s]) => {
                    const Icon = s.icon; const active = shipMethod === key;
                    return (
                      <button key={key} onClick={() => setShipMethod(key)} style={{
                        display: "flex", alignItems: "center", gap: 10, border: `1.5px solid ${active ? TOKENS.cat : TOKENS.line}`,
                        background: active ? TOKENS.catSoft : "#fff", borderRadius: 14, padding: 12, cursor: "pointer", textAlign: "left",
                      }}>
                        <Icon size={18} color={active ? TOKENS.cat : TOKENS.inkSoft} />
                        <div>
                          <div style={{ fontFamily: "Prompt", fontWeight: 500, fontSize: 13, color: TOKENS.ink }}>{s.label}</div>
                          <div style={{ fontFamily: "Sarabun", fontSize: 11.5, color: TOKENS.inkSoft }}>{s.sub} · {money(s.price)}</div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* วิธีชำระเงิน */}
              <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 18, padding: 18 }}>
                <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 14, color: TOKENS.ink, marginBottom: 12 }}>วิธีชำระเงิน</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {PAYMENTS.map((p) => {
                    const Icon = p.icon; const active = payMethod === p.id;
                    return (
                      <button key={p.id} onClick={() => setPayMethod(p.id)} style={{
                        display: "flex", alignItems: "center", gap: 10, border: `1.5px solid ${active ? TOKENS.fish : TOKENS.line}`,
                        background: active ? TOKENS.fishSoft : "#fff", borderRadius: 14, padding: 12, cursor: "pointer", textAlign: "left",
                      }}>
                        <Icon size={18} color={active ? TOKENS.fish : TOKENS.inkSoft} />
                        <div style={{ fontFamily: "Prompt", fontWeight: 500, fontSize: 13, color: TOKENS.ink }}>{p.label}</div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* สรุปคำสั่งซื้อ */}
            <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 18, padding: 18, position: "sticky", top: 90 }}>
              <div style={{ fontFamily: "Prompt", fontWeight: 600, fontSize: 14, color: TOKENS.ink, marginBottom: 14 }}>สรุปคำสั่งซื้อ</div>

              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input value={promo} onChange={(e) => setPromo(e.target.value)} placeholder="ใส่โค้ดส่วนลด" style={{
                  flex: 1, border: `1px solid ${TOKENS.line}`, borderRadius: 10, padding: "9px 12px", fontFamily: "Sarabun", fontSize: 13, outline: "none",
                }} />
                <button onClick={applyPromo} style={{ border: "none", background: TOKENS.ink, color: "#fff", borderRadius: 10, padding: "0 14px", fontFamily: "Prompt", fontSize: 12.5, cursor: "pointer" }}>ใช้โค้ด</button>
              </div>
              {promoMsg && <div style={{ fontFamily: "Sarabun", fontSize: 11.5, color: appliedPromo ? TOKENS.green : TOKENS.cat, marginBottom: 10 }}>{promoMsg}</div>}
              <div style={{ fontFamily: "Sarabun", fontSize: 11, color: TOKENS.inkSoft, marginBottom: 14 }}>ลองโค้ด WELCOME10 หรือ PETLOVER</div>

              <SummaryRow label="ยอดรวมสินค้า" value={money(subtotal)} />
              {discount > 0 && <SummaryRow label="ส่วนลด" value={"-" + money(discount)} color={TOKENS.green} />}
              <SummaryRow label="ค่าจัดส่ง" value={money(shippingCost)} />
              <div style={{ borderTop: `1px solid ${TOKENS.line}`, margin: "10px 0" }} />
              <SummaryRow label="ยอดชำระทั้งหมด" value={money(total)} bold />

              <button onClick={placeOrder} disabled={!addressComplete} style={{
                width: "100%", marginTop: 16, border: "none", cursor: addressComplete ? "pointer" : "not-allowed",
                background: addressComplete ? TOKENS.cat : TOKENS.line, color: addressComplete ? "#fff" : TOKENS.inkSoft,
                fontFamily: "Prompt", fontWeight: 600, fontSize: 14.5, padding: "13px 16px", borderRadius: 999,
                display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              }}>
                <Lock size={14} /> ยืนยันการสั่งซื้อ
              </button>
              {!addressComplete && <div style={{ fontFamily: "Sarabun", fontSize: 11, color: TOKENS.inkSoft, marginTop: 8, textAlign: "center" }}>กรอกที่อยู่จัดส่งให้ครบก่อนยืนยัน</div>}
            </div>
          </div>
        </div>
      );
    }

    function Field({ label, value, onChange }) {
      return (
        <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <span style={{ fontFamily: "Sarabun", fontSize: 11.5, color: TOKENS.inkSoft }}>{label}</span>
          <input value={value} onChange={(e) => onChange(e.target.value)} style={{
            border: `1px solid ${TOKENS.line}`, borderRadius: 10, padding: "9px 11px", fontFamily: "Sarabun", fontSize: 13, outline: "none",
          }} />
        </label>
      );
    }
    function SummaryRow({ label, value, bold, color }) {
      return (
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontFamily: "Sarabun", fontSize: bold ? 14 : 13, color: bold ? TOKENS.ink : TOKENS.inkSoft, fontWeight: bold ? 600 : 400 }}>{label}</span>
          <span style={{ fontFamily: "Prompt", fontSize: bold ? 16 : 13, color: color || TOKENS.ink, fontWeight: bold ? 700 : 500 }}>{value}</span>
        </div>
      );
    }

    /* --------------------------- ผู้ช่วย AI แนะนำสัตว์เลี้ยง --------------------------- */
    const CATALOG_SUMMARY = PRODUCTS.map((p) => `${p.name} (${CATS.find(c=>c.id===p.cat).label}, ${money(p.price)})`).join("; ");

    function ChatView() {
      const [messages, setMessages] = useState([
        { role: "assistant", text: "สวัสดีค่ะ 🐾 ดิฉันคือผู้ช่วย AI ของอุ้งเท้า ยินดีช่วยหาสัตว์เลี้ยงที่เหมาะกับไลฟ์สไตล์คุณที่สุด จากสัตว์กว่า 6 ประเภทในร้าน ทั้งปลา แมว สุนัข กระต่าย นก และสัตว์เลื้อยคลาน\n\nอยากเริ่มจากอะไรดี — ที่พักของคุณเป็นคอนโดหรือบ้าน และมีเวลาดูแลสัตว์เลี้ยงต่อวันประมาณเท่าไหร่คะ?" },
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const scrollRef = useRef(null);

      useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, loading]);

      const quickPrompts = [
        "อยู่คอนโด งบน้อย เวลาว่างน้อย",
        "บ้านมีสวน ชอบสัตว์ตัวใหญ่",
        "มีลูกเล็ก แพ้ขนสัตว์",
        "อยากได้สัตว์แปลกที่ดูแลง่าย",
      ];

      const send = async (textOverride) => {
        const text = (textOverride ?? input).trim();
        if (!text || loading) return;
        const newMessages = [...messages, { role: "user", text }];
        setMessages(newMessages);
        setInput("");
        setLoading(true);

        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 1200,
              system: `คุณคือผู้ช่วย AI แนะนำสัตว์เลี้ยงมืออาชีพของร้าน "อุ้งเท้า (Paw Market)" ซึ่งขายปลา แมว สุนัข กระต่าย/สัตว์เล็ก นก และสัตว์เลื้อยคลาน

    รายการสินค้าจริงในร้าน (ชื่อ, หมวด, ราคา): ${CATALOG_SUMMARY}

    วิธีทำงาน:
    1. ถามคำถามเจาะลึกทีละ 1-2 ข้อเพื่อเข้าใจลูกค้าอย่างแท้จริง ครอบคลุมประเด็นสำคัญ เช่น ที่พัก (คอนโด/บ้าน/มีสวนหรือไม่), เวลาว่างดูแลต่อวัน, งบประมาณค่าตัวและค่าดูแลรายเดือน, ประสบการณ์เลี้ยงสัตว์ที่ผ่านมา, มีเด็กเล็กหรือผู้สูงอายุในบ้านไหม, มีคนแพ้ขนสัตว์ไหม, ต้องการสัตว์ที่เข้าสังคมเก่งหรือเลี้ยงแบบสังเกตอยู่ห่างๆ ก็พอ, เสียงรบกวนเพื่อนบ้านเป็นปัญหาไหม
    2. ปรับคำถามให้ตรงกับสิ่งที่ลูกค้าพูดมาก่อนหน้า อย่าถามคำถามเดิมซ้ำ และอย่าถามครบทุกข้อในคราวเดียว ให้เป็นบทสนทนาธรรมชาติ
    3. หากลูกค้าให้ข้อมูลมาเยอะพอแล้ว (ปกติ 2-4 รอบคำถาม) หรือขอคำแนะนำโดยตรง ให้สรุปวิเคราะห์และแนะนำชนิด/สายพันธุ์สัตว์เลี้ยงที่เหมาะสมที่สุด 1-2 ชนิด พร้อมเหตุผลที่อ้างอิงจากสิ่งที่ลูกค้าบอกมาโดยตรง (ไม่ใช่คำแนะนำทั่วไป)
    4. เมื่อแนะนำ ให้เอ่ยชื่อสินค้าจริงจากรายการด้านบนที่ตรงกับคำแนะนำ พร้อมราคา เพื่อให้ลูกค้าไปดูในร้านต่อได้ทันที
    5. หากคำขอของลูกค้าไม่เหมาะกับไลฟ์สไตล์ที่บอกมา (เช่น อยากได้สุนัขตัวใหญ่แต่อยู่คอนโดเล็กไม่มีเวลา) ให้ทักท้วงอย่างสุภาพและเสนอทางเลือกที่เหมาะกว่า พร้อมอธิบายเหตุผล
    6. ตอบเป็นภาษาไทยเท่านั้น น้ำเสียงเป็นกันเอง อบอุ่น เป็นมืออาชีพ กระชับได้ใจความ ใช้อีโมจิพองาม ไม่ต้องยาวเกินไป`,
              messages: newMessages.map((m) => ({ role: m.role, content: m.text })),
            }),
          });
          const data = await response.json();
          const textBlocks = (data.content || []).filter((c) => c.type === "text").map((c) => c.text);
          const reply = textBlocks.join("\n").trim() || "ขอโทษค่ะ ตอนนี้ผู้ช่วยไม่สามารถตอบได้ ลองอีกครั้งนะคะ";
          setMessages((prev) => [...prev, { role: "assistant", text: reply }]);
        } catch (e) {
          setMessages((prev) => [...prev, { role: "assistant", text: "ขออภัยค่ะ การเชื่อมต่อผู้ช่วย AI มีปัญหาชั่วคราว ลองพิมพ์อีกครั้งได้เลยค่ะ 🐾" }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{ maxWidth: 720, margin: "0 auto", padding: "28px 20px 50px" }}>
          <div style={{ textAlign: "center", marginBottom: 20 }}>
            <div style={{ width: 54, height: 54, borderRadius: 18, background: TOKENS.pink, margin: "0 auto 12px", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Sparkles size={26} color="#fff" />
            </div>
            <h2 style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 24, color: TOKENS.ink, margin: "0 0 6px" }}>ผู้ช่วย AI เลือกสัตว์เลี้ยง</h2>
            <p style={{ fontFamily: "Sarabun", fontSize: 13.5, color: TOKENS.inkSoft, margin: 0 }}>ตอบคำถามสั้นๆ ให้ AI วิเคราะห์ไลฟ์สไตล์แล้วแนะนำสัตว์เลี้ยงพร้อมสินค้าจริงในร้าน</p>
          </div>

          <div style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 24, display: "flex", flexDirection: "column", height: 540, overflow: "hidden" }}>
            <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "20px", display: "flex", flexDirection: "column", gap: 14 }}>
              {messages.map((m, i) => (
                <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
                  {m.role === "assistant" && (
                    <div style={{ width: 28, height: 28, borderRadius: 10, background: TOKENS.pink, flexShrink: 0, marginRight: 8, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <PawPrint size={14} color="#fff" />
                    </div>
                  )}
                  <div style={{
                    maxWidth: "78%", padding: "11px 15px", borderRadius: m.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                    background: m.role === "user" ? TOKENS.ink : TOKENS.bg, color: m.role === "user" ? "#fff" : TOKENS.ink,

              {loading && (

                  <div style={{ width: 28, height: 28, borderRadius: 10, background: TOKENS.pink, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <PawPrint size={14} color="#fff" />
                  </div>
                  <div style={{ fontFamily: "Sarabun", fontSize: 13, color: TOKENS.inkSoft, padding: "11px 15px", background: TOKENS.bg, borderRadius: "16px 16px 16px 4px" }}>กำลังพิมพ์...</div>
                </div>
              )}
            </div>

            {messages.length <= 1 && (
              <div style={{ padding: "0 16px 12px", display: "flex", gap: 8, flexWrap: "wrap" }}>
                {quickPrompts.map((q) => (
                  <button key={q} onClick={() => send(q)} style={{ border: `1px solid ${TOKENS.line}`, background: "#fff", borderRadius: 999, padding: "7px 13px", fontFamily: "Sarabun", fontSize: 12.5, color: TOKENS.inkSoft, cursor: "pointer" }}>{q}</button>

            <div style={{ display: "flex", gap: 8, padding: 14, borderTop: `1px solid ${TOKENS.line}` }}>

                flex: 1, border: `1px solid ${TOKENS.line}`, borderRadius: 999, padding: "11px 16px", fontFamily: "Sarabun", fontSize: 14, outline: "none",
              }} />
              <button onClick={() => send()} disabled={loading} style={{

              }}><Send size={16} /></button>

          </div>
        </div>

    }

    /* --------------------------- หน้าล็อกอินผู้ขาย --------------------------- */
    function SellerLogin({ onLogin }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [showPw, setShowPw] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const submit = (e) => {
        e.preventDefault();
        if (!email.trim() || !password.trim()) { setError("กรุณากรอกอีเมลและรหัสผ่านให้ครบ"); return; }
        setError(""); setLoading(true);
        setTimeout(() => { setLoading(false); onLogin(email); }, 700);
      };

      return (
        <div style={{ maxWidth: 420, margin: "0 auto", padding: "70px 20px" }}>
          <div style={{ textAlign: "center", marginBottom: 22 }}>
            <div style={{ width: 54, height: 54, borderRadius: 18, background: TOKENS.ink, margin: "0 auto 14px", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Lock size={24} color="#fff" />
            </div>
            <h2 style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 22, color: TOKENS.ink, margin: "0 0 6px" }}>เข้าสู่ระบบผู้ขาย</h2>
            <p style={{ fontFamily: "Sarabun", fontSize: 13.5, color: TOKENS.inkSoft, margin: 0 }}>เข้าสู่ระบบเพื่อดูแดชบอร์ดยอดขายและบทวิเคราะห์จาก AI</p>
          </div>

          <form onSubmit={submit} style={{ background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 20, padding: 22, display: "flex", flexDirection: "column", gap: 14 }}>
            <label style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              <span style={{ fontFamily: "Sarabun", fontSize: 12, color: TOKENS.inkSoft }}>อีเมลผู้ขาย</span>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seller@pawmarket.co.th" style={{
                border: `1px solid ${TOKENS.line}`, borderRadius: 12, padding: "11px 14px", fontFamily: "Sarabun", fontSize: 14, outline: "none",
              }} />
            </label>
            <label style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              <span style={{ fontFamily: "Sarabun", fontSize: 12, color: TOKENS.inkSoft }}>รหัสผ่าน</span>
              <div style={{ position: "relative" }}>
                <input type={showPw ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" style={{
                  width: "100%", boxSizing: "border-box", border: `1px solid ${TOKENS.line}`, borderRadius: 12, padding: "11px 40px 11px 14px", fontFamily: "Sarabun", fontSize: 14, outline: "none",
                }} />
                <button type="button" onClick={() => setShowPw((s) => !s)} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", border: "none", background: "none", cursor: "pointer", color: TOKENS.inkSoft }}>
                  {showPw ? <EyeOff size={16} /> : <Eye size={16} />}
                </button>
              </div>
            </label>
            {error && <div style={{ fontFamily: "Sarabun", fontSize: 12.5, color: TOKENS.cat }}>{error}</div>}
            <button type="submit" disabled={loading} style={{
              border: "none", background: TOKENS.ink, color: "#fff", fontFamily: "Prompt", fontWeight: 600, fontSize: 14, padding: "12px 16px",
              borderRadius: 999, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, opacity: loading ? 0.7 : 1,
            }}>{loading ? "กำลังเข้าสู่ระบบ..." : <>เข้าสู่ระบบ <ChevronRight size={15} /></>}</button>
            <div style={{ fontFamily: "Sarabun", fontSize: 11.5, color: TOKENS.inkSoft, textAlign: "center" }}>เดโม: กรอกอีเมลและรหัสผ่านใดก็ได้เพื่อเข้าสู่ระบบ</div>
          </form>
        </div>
      );
    }

    /* --------------------------- แดชบอร์ดผู้ขาย + AI วิเคราะห์ --------------------------- */
    function DashboardView() {
      const [loggedIn, setLoggedIn] = useState(false);
      const [sellerEmail, setSellerEmail] = useState("");
      const [insight, setInsight] = useState(null);
      const [insightLoading, setInsightLoading] = useState(true);

      useEffect(() => {
        if (!loggedIn) return;
        let cancelled = false;
        async function fetchInsight() {
          setInsightLoading(true);
          try {
            const payload = { trend: SALES_TREND, share: CAT_SHARE, topProducts: TOP_PRODUCTS };
            const response = await fetch("https://api.anthropic.com/v1/messages", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                model: "claude-sonnet-4-6",
                max_tokens: 1000,
                system: "คุณคือนักวิเคราะห์ข้อมูลการขายให้ผู้ขายบนแพลตฟอร์มขายสัตว์เลี้ยงชื่อ 'อุ้งเท้า' จะได้รับข้อมูล JSON เกี่ยวกับยอดขายรายเดือน สัดส่วนยอดขายตามหมวดสัตว์เลี้ยง และสินค้าขายดี ให้วิเคราะห์และตอบกลับเป็น JSON เท่านั้น ไม่มีคำอธิบายอื่นใดๆ ไม่มี markdown fence รูปแบบ: {\"summary\": \"สรุปภาพรวม 1-2 ประโยค ภาษาไทย\", \"insights\": [\"ข้อสังเกต 1\", \"ข้อสังเกต 2\", \"ข้อสังเกต 3\"], \"actions\": [\"คำแนะนำเชิงปฏิบัติ 1\", \"คำแนะนำเชิงปฏิบัติ 2\"]} แต่ละข้อความสั้น กระชับ ไม่เกิน 20 คำ",
                messages: [{ role: "user", content: `นี่คือข้อมูลยอดขายของร้าน: ${JSON.stringify(payload)}` }],
              }),
            });
            const data = await response.json();
            const textBlocks = (data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("");
            const clean = textBlocks.replace(/```json|```/g, "").trim();
            const parsed = JSON.parse(clean);
            if (!cancelled) setInsight(parsed);
          } catch (e) {
            if (!cancelled) {
              setInsight({
                summary: "ยอดขายเดือนนี้เติบโตต่อเนื่อง โดยหมวดปลาและแมวทำยอดขายได้ดีที่สุด",
                insights: ["ยอดขายรวมเพิ่มขึ้นจากเดือนก่อนหน้า แนวโน้มเป็นขาขึ้น", "หมวดปลาครองสัดส่วนยอดขายสูงสุด", "กุ้งเชอร์รี่และปลากัดฮาล์ฟมูนเป็นสินค้าขายดีต่อเนื่อง"],
                actions: ["เพิ่มสต๊อกสินค้าหมวดปลาช่วงสัปดาห์หน้า", "ทำโปรโมชันสินค้าหมวดที่สัดส่วนยังต่ำ เช่น นกและสัตว์เลื้อยคลาน"],
              });
            }
          } finally { if (!cancelled) setInsightLoading(false); }
        }
        fetchInsight();
        return () => { cancelled = true; };

        { label: "คำสั่งซื้อ", value: "312", change: "+8.1%", up: true, icon: Package, color: TOKENS.fish },
        { label: "ลูกค้าใหม่", value: "94", change: "+4.6%", up: true, icon: Users, color: TOKENS.green },
        { label: "อัตราคืนสินค้า", value: "1.2%", change: "-0.4%", up: false, icon: TrendingUp, color: TOKENS.dog },

                  </div>
                  <div style={{ fontFamily: "Prompt", fontWeight: 700, fontSize: 22, color: TOKENS.ink }}>{s.value}</div>
                  <div style={{ fontFamily: "Sarabun", fontSize: 12, color: TOKENS.inkSoft, marginTop: 2 }}>{s.label}</div>

                <YAxis type="category" dataKey="name" tick={{ fontFamily: "Sarabun", fontSize: 12.5, fill: TOKENS.ink }} axisLine={false} tickLine={false} width={110} />
                <Tooltip contentStyle={{ fontFamily: "Sarabun", fontSize: 12.5, borderRadius: 10, border: `1px solid ${TOKENS.line}` }} />
                <Bar dataKey="ชิ้น" radius={[0, 8, 8, 0]} fill={TOKENS.fish} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    }

    /* --------------------------- แอปหลัก --------------------------- */
    function PawMarket() {
      const [view, setView] = useState("shop");
      const [cart, setCart] = useState([]);

      const addToCart = (product, qty = 1) => {
        setCart((prev) => {
          const existing = prev.find((it) => it.product.id === product.id);
          if (existing) return prev.map((it) => it.product.id === product.id ? { ...it, qty: it.qty + qty } : it);
          return [...prev, { product, qty }];
        });
      };
      const updateQty = (id, qty) => {
        setCart((prev) => qty <= 0 ? prev.filter((it) => it.product.id !== id) : prev.map((it) => it.product.id === id ? { ...it, qty } : it));
      };
      const removeItem = (id) => setCart((prev) => prev.filter((it) => it.product.id !== id));

      const cartCount = cart.reduce((s, it) => s + it.qty, 0);

      return (
        <div style={{ fontFamily: "Sarabun, sans-serif", background: TOKENS.bg, minHeight: "100vh", color: TOKENS.ink }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap');
            * { box-sizing: border-box; }
            input:focus { border-color: ${TOKENS.pink} !important; }
            ::-webkit-scrollbar { width: 8px; height: 8px; }
            ::-webkit-scrollbar-thumb { background: ${TOKENS.line}; border-radius: 8px; }
            button:focus-visible, input:focus-visible { outline: 2px solid ${TOKENS.pink}; outline-offset: 2px; }
          `}</style>

          <NavBar view={view} setView={setView} cartCount={cartCount} />

          {view === "shop" && <ShopView addToCart={addToCart} />}
          {view === "cart" && <CartView cart={cart} updateQty={updateQty} removeItem={removeItem} setView={setView} />}
          {view === "chat" && <ChatView />}
          {view === "dashboard" && <DashboardView />}

          <div style={{ borderTop: `1px solid ${TOKENS.line}`, padding: "26px 20px", textAlign: "center" }}>
            <PawDivider />
            <div style={{ fontFamily: "Sarabun", fontSize: 12, color: TOKENS.inkSoft, marginTop: 6 }}>© 2026 อุ้งเท้า (Paw Market) — ตลาดสัตว์เลี้ยงออนไลน์</div>
          </div>
        </div>
      );
    }

    // ทำการ render ลงใน <div id="root">
    const root = createRoot(document.getElementById('root'));
    root.render(<PawMarket />);
  </script>
</body>
</html>
